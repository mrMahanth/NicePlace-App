name: niceplace_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app-launcher-logo.png"
  adaptive_icon_background: "#F2FAFC"
  adaptive_icon_foreground: "assets/images/app-launcher-logo.png"

flutter_native_splash:
  color: "#F2FAFC"
  image: "assets/images/splash-logo-640.png"
  android: true
  ios: false